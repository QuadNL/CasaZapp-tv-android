name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build debug APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :tv:assembleDebug --console=plain

  release:
    name: Release signed APK
    # Every push to main is a build; the app updates itself from the latest release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build name
        run: echo "BUILD_DATE=$(TZ=Europe/Amsterdam date +%y%m%d)" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE ontbreekt (zie README → Releases)"; exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :tv:assembleRelease --console=plain
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tv/build/outputs/apk/release/tv-release.apk casazapp-tv.apk
          gh release create "$BUILD_DATE-$BUILD_NUMBER" casazapp-tv.apk \
            --title "$BUILD_DATE-$BUILD_NUMBER" \
            --notes "$(git log -1 --pretty=%s)"
