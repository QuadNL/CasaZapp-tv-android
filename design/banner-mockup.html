<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Banner-opties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Figtree:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#080c11; --accent:#ffb547; --ink:#1c1305; --text:#e8edf3; --muted:#8b97a6; }
  body { margin:0; background:#111; color:var(--text); font-family:Figtree, sans-serif; padding:24px; }
  h1 { font-size:18px; margin:0 0 20px; }
  .row { display:flex; flex-wrap:wrap; gap:32px; }
  figure { margin:0; }
  figcaption { margin-top:10px; font-size:14px; color:var(--muted); max-width:320px; }
  figcaption b { color:var(--text); }
  .banner { width:320px; height:180px; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:16px; overflow:hidden; box-shadow:0 0 0 3px #fff; }
  .name { font-family:Sora, sans-serif; font-weight:700; font-size:32px; letter-spacing:-0.5px; }
  .logo { width:52px; height:52px; border-radius:12px; display:grid; place-items:center; }
  .a { background:var(--accent); }
  .a .name { color:var(--ink); }
  .a .logo { background:var(--ink); }
  .b { background:radial-gradient(70% 90% at 25% 30%, #1e3a5f, transparent 70%), linear-gradient(160deg,#141c28,#05070a); }
  .b .name { color:#fff; }
  .b .logo { background:var(--accent); }
  .now { background:var(--bg); box-shadow:none; }
  .now .logo { background:var(--accent); width:42px; height:32px; border-radius:6px; }
</style>
</head>
<body>
<h1>Android TV-banner, optie B zonder "TV" (320×180, zoals op het startscherm)</h1>
<div class="row">
  <figure>
    <div class="banner b">
      <div class="logo" style="width:64px;height:64px;border-radius:15px"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1c1305" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V10z"/><path d="M10 12v6l5-3z" fill="#1c1305" stroke="none"/></svg></div>
      <span class="name">CasaZapp</span>
    </div>
    <figcaption><b>B1</b>: logo 64 px, naam 32 px.</figcaption>
  </figure>
  <figure>
    <div class="banner b">
      <div class="logo" style="width:76px;height:76px;border-radius:17px"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1c1305" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V10z"/><path d="M10 12v6l5-3z" fill="#1c1305" stroke="none"/></svg></div>
      <span class="name">CasaZapp</span>
    </div>
    <figcaption><b>B2</b>: logo 76 px (bijna half zo hoog als de banner), naam 32 px.</figcaption>
  </figure>
  <figure>
    <div class="banner b" style="flex-direction:column;gap:10px">
      <div class="logo" style="width:72px;height:72px;border-radius:16px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1c1305" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V10z"/><path d="M10 12v6l5-3z" fill="#1c1305" stroke="none"/></svg></div>
      <span class="name" style="font-size:28px;line-height:1">CasaZapp</span>
    </div>
    <figcaption><b>B3</b>: logo 72 px in het midden, naam 28 px eronder.</figcaption>
  </figure>
</div>
</body>
</html>
